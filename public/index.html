<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus 8 y 25 Málaga</title>
<meta name="theme-color" content="#d9480f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/vendor/leaflet.min.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mut:#667085; --line:#e3e6ea; --c8:#d9480f; --c25:#1971c2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1d2227; --ink:#e8eaed; --mut:#9aa3ad; --line:#2d343b; --c8:#ff8c5a; --c25:#74b0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, sans-serif; display:flex; height:100vh; height:100dvh; }
  #panel { width:380px; max-width:45vw; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  #map { flex:1; }
  h1 { font-size:18px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, select { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  select { width:100%; margin-top:6px; }
  .badge { display:inline-block; min-width:30px; text-align:center; font-weight:700; color:#fff; border-radius:6px; padding:1px 7px; }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .dir { font-weight:700; font-size:12px; letter-spacing:.04em; padding:1px 7px; border-radius:6px; border:2px solid currentColor; }
  details { margin-top:4px; } summary { cursor:pointer; }
  .falta { margin:4px 0 4px 8px; padding-left:20px; font-size:13px; } .falta .tuya { font-weight:700; }
  .l8 { background:var(--c8); } .l25 { background:var(--c25); }
  .mut { color:var(--mut); font-size:13px; }
  .big { font-size:20px; font-weight:700; }
  #status { font-size:12px; color:var(--mut); }
  @media (max-width:760px) { body { flex-direction:column-reverse; } #panel { width:100%; max-width:none; height:55vh; } #map { height:45vh; flex:none; } }
</style>
</head>
<body>
<div id="panel">
  <h1>Bus 8 y 25 · Málaga</h1>
  <div class="card">
    <div class="mut">Tu posición</div>
    <div id="origen"><b>Calle Juan de Rihuerga</b></div>
    <div class="row" style="margin-top:8px">
      <button id="gps">Usar mi ubicación</button>
      <button id="reset">Juan de Rihuerga</button>
    </div>
    <div class="mut" style="margin-top:6px">También puedes hacer clic en el mapa para mover tu posición.</div>
  </div>
  <div class="card">
    <div class="mut">Mostrar</div>
    <div id="chips" class="row" style="margin-top:6px"></div>
  </div>
  <div id="cards"></div>
  <div class="row"><button id="refresh">↻ Actualizar</button><div id="status">Cargando…</div></div>
</div>
<div id="map"></div>

<script src="/vendor/leaflet.min.js"></script>
<script>
const DEFAULT = { lat: 36.7261628, lon: -4.4655865, name: 'Calle Juan de Rihuerga' };
const COLOR = { '8': '#d9480f', '25': '#1971c2' };
const WALK_MS = 1.33, WALK_DETOUR = 1.25;   // 4,8 km/h y rodeo medio por calles
const BUS_MS = 4.4, DWELL_S = 20;           // ~16 km/h de media + 20 s por parada (estimación)

let data = {}, buses = [], est = null, origin = { ...DEFAULT };
let choice = {};  // 'linea-sentido' -> cod de la parada destino X
const map = L.map('map').setView([DEFAULT.lat, DEFAULT.lon], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);

const dist = (a, b) => {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const mins = s => s < 0 ? 'ahora' : Math.floor(s / 60) + ' min';
const hhmm = s => new Date(Date.now() + s * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const segTime = (stops, i) => dist(stops[i], stops[i+1]) * 1.3 / BUS_MS + DWELL_S;
const travel = (stops, from, to) => { let t = 0; for (let i = from; i < to; i++) t += segTime(stops, i); return t; };

function plan() {
  const out = [];
  for (const [l, info] of Object.entries(data)) {
    for (const [s, stops] of Object.entries(info.sentidos)) {
      let best = 0, bd = Infinity;
      stops.forEach((p, i) => { const d = dist(origin, p); if (d < bd) { bd = d; best = i; } });
      const walk = bd * WALK_DETOUR / WALK_MS;
      // autobuses de esta línea/sentido que aún no han pasado por mi parada
      // preferimos las estimaciones oficiales de EMT; si no hay, calculamos con la posición del bus
      const oficial = est && est.filter(e => e.cod === stops[best].cod && e.linea === l && e.sentido === s)
        .sort((a, c) => a.seg - c.seg).slice(0, 3)
        // misma cuenta que la web de EMT: hora absoluta de salida menos ahora (el campo "seg" va unos 2 min por encima)
        .map(e => ({ b: { bus: e.vehiculo }, vid: e.vehiculo, eta: (e.dep - Date.now()) / 1000, dep: e.dep, dist: e.dist, oficial: true,
          idx: stops.findIndex(p => buses.some(b => b.bus === String(e.vehiculo) && b.parada === p.cod)) }));
      const arr = oficial || buses.filter(b => b.linea === l && b.sentido === s)
        .map(b => ({ b, idx: stops.findIndex(p => p.cod === b.parada) }))
        .filter(x => x.idx >= 0 && x.idx <= best)
        .map(x => ({ ...x, eta: travel(stops, x.idx, best) }))
        .sort((a, c) => a.eta - c.eta).slice(0, 2);
      out.push({ l, s, info, stops, best, bd, walk, arr });
    }
  }
  return out.sort((a, b) => a.bd - b.bd);
}

const destNames = {};  // destino oficial por 'linea-sentido', tomado de las estimaciones de EMT
const cab = (l, s, info) => destNames[l + '-' + s] || info.cabeceras[s];
const DIR = { '1': 'IDA', '2': 'VUELTA' };
const abiertos = new Set();   // desplegables abiertos, para que no se cierren al refrescar
let sel = 'all';   // 'all' o 'linea-sentido'

function renderChips() {
  const box = document.getElementById('chips');
  box.innerHTML = '';
  const add = (k, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (sel === k ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { sel = k; render(); };
    box.appendChild(b);
  };
  add('all', 'Todas');
  for (const [l, info] of Object.entries(data))
    for (const s of Object.keys(info.sentidos)) add(l + '-' + s, `${l} ${DIR[s]} → ${cab(l, s, info)}`);
}

// paradas que le faltan al bus hasta la mía, empezando por la siguiente a su última parada
function quedan(o, a) {
  if (a.idx == null || a.idx < 0 || a.idx > o.best) return '<div class="mut">Posición del bus no disponible</div>';
  const falta = o.stops.slice(a.idx + 1, o.best + 1);
  if (!falta.length) return '<div class="mut">Está en tu parada</div>';
  return `<div class="mut">Última parada: ${o.stops[a.idx].nombre}</div><div><b>${falta.length}</b> paradas hasta la tuya:</div><ol class="falta">` +
    falta.map((p, i) => `<li${i === falta.length - 1 ? ' class="tuya"' : ''}>${p.nombre}</li>`).join('') + '</ol>';
}

function render() {
  layer.clearLayers();
  renderChips();
  L.circleMarker([origin.lat, origin.lon], { radius: 9, color: '#222', fillColor: '#fab005', fillOpacity: 1 })
    .bindTooltip('Tú', { permanent: false }).addTo(layer);
  const p = plan();
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  for (const o of p) {
    const key = o.l + '-' + o.s, stop = o.stops[o.best], color = COLOR[o.l];
    if (sel !== 'all' && sel !== key) continue;
    // trazado del sentido y paradas
    L.polyline(o.stops.map(x => [x.lat, x.lon]), { color, weight: 3, opacity: .55 }).addTo(layer);
    L.circleMarker([stop.lat, stop.lon], { radius: 8, color, fillColor: '#fff', fillOpacity: 1, weight: 3 })
      .bindPopup(`<b>${o.l}</b> · ${stop.nombre}`).addTo(layer);
    const nx = o.arr[0];
    if (nx && nx.idx >= 0 && nx.idx <= o.best)   // paradas que le quedan al próximo bus
      o.stops.slice(nx.idx + 1, o.best).forEach(p => L.circleMarker([p.lat, p.lon], { radius: 5, color, fillColor: color, fillOpacity: .9, weight: 1 })
        .bindTooltip(p.nombre).addTo(layer));
    L.polyline([[origin.lat, origin.lon], [stop.lat, stop.lon]], { color: '#555', dashArray: '4 6', weight: 2 }).addTo(layer);

    const destIdx = o.stops.findIndex((x, i) => i > o.best && x.cod === +choice[key]);
    let dest = '';
    if (destIdx >= 0) {
      const d = o.stops[destIdx], first = o.arr[0];
      // si EMT da la llegada del mismo bus a X, el viaje es la diferencia; si no, estimación propia
      const xe = first && first.oficial && est.find(e => e.cod === d.cod && e.vehiculo === first.vid && e.linea === o.l);
      const ride = xe ? (xe.dep - first.dep) / 1000 : travel(o.stops, o.best, destIdx);
      L.marker([d.lat, d.lon]).bindPopup('Destino: ' + d.nombre).addTo(layer);
      dest = `<div style="margin-top:8px">En bus hasta <b>${d.nombre}</b>: ~${mins(ride)} de viaje` +
        (first ? `<br>Llegarías sobre las <b>${hhmm(first.eta + ride)}</b> <span class="mut">${xe ? '(dato EMT)' : '(estimado)'}</span>` : `<br><span class="mut">Sin bus en ruta ahora mismo</span>`) + '</div>';
    }
    const opts = '<option value="">¿A qué parada vas? (X)</option>' +
      o.stops.slice(o.best + 1).map(x => `<option value="${x.cod}" ${+choice[key] === x.cod ? 'selected' : ''}>${x.nombre}</option>`).join('');

    const busHtml = o.arr.length
      ? o.arr.map(a => `<details data-k="${key}-${a.b.bus}" ${abiertos.has(key + '-' + a.b.bus) ? 'open' : ''}><summary>Bus ${a.b.bus}: llega en <b>${mins(a.eta)}</b> <span class="mut">(${hhmm(a.eta)}, ${a.oficial ? 'a ' + a.dist + ' m · EMT' : 'a ' + (o.best - a.idx) + ' paradas · estimado'})</span></summary>${quedan(o, a)}</details>`).join('')
      : '<div class="mut">Ningún bus acercándose ahora mismo</div>';

    const div = document.createElement('div');
    div.className = 'card';
    div.style.borderLeft = `6px solid ${color}`;
    div.innerHTML = `<div class="row"><span class="badge l${o.l}">${o.l}</span> <span class="dir" style="color:${color}">${DIR[o.s]}</span> <b>→ ${cab(o.l, o.s, o.info)}</b></div>
      <div style="margin-top:6px">Parada: <b>${stop.nombre}</b></div>
      <div class="mut">A ${Math.round(o.bd)} m · ~${Math.max(1, Math.round(o.walk / 60))} min andando</div>
      <div style="margin-top:6px">${busHtml}</div>
      <select data-key="${key}">${opts}</select>${dest}`;
    div.querySelectorAll('details').forEach(d => d.ontoggle = () => d.open ? abiertos.add(d.dataset.k) : abiertos.delete(d.dataset.k));
    div.querySelector('select').onchange = e => { choice[key] = e.target.value; render(); refresh(); };
    cards.appendChild(div);
  }
  // buses en vivo
  for (const b of buses) {
    if (sel !== 'all' && sel !== b.linea + '-' + b.sentido) continue;
    const ida = b.sentido === '1';
    L.marker([b.lat, b.lon], { icon: L.divIcon({ className: '', iconSize: [64, 20],
      html: `<div style="background:${COLOR[b.linea]};color:#fff;border-radius:5px;font:700 12px sans-serif;text-align:center;padding:2px 4px;border:2px solid #fff;white-space:nowrap">${b.linea} ${ida ? 'IDA ▶' : '◀ VUELTA'}</div>` }) })
      .bindTooltip(`Bus ${b.bus} · línea ${b.linea} · ${DIR[b.sentido]} · ${b.actualizado || ''}`).addTo(layer);
  }
}

async function refresh() {
  const st = document.getElementById('status'), btn = document.getElementById('refresh');
  btn.disabled = true; btn.textContent = '↻ Actualizando…';
  try {
    buses = await (await fetch('/api/live')).json();
    if (buses.error) throw new Error(buses.error);
    // paradas de subida + destinos elegidos -> estimaciones oficiales de EMT
    const codes = new Set(plan().map(o => o.stops[o.best].cod));
    Object.values(choice).forEach(c => c && codes.add(+c));
    try {
      const r = await (await fetch('/api/estim?cod=' + [...codes].join(','))).json();
      est = r.error ? null : r;
      (est || []).forEach(e => { if (e.destino) destNames[e.linea + '-' + e.sentido] = e.destino; });
    } catch { est = null; }
    st.textContent = `${buses.length} buses en ruta · actualizado ${new Date().toLocaleTimeString('es-ES')} · ` +
      (est ? 'tiempos de llegada de EMT' : 'estimaciones propias (EMT no responde)');
    render();
  } catch (e) { st.textContent = 'Error con los datos en vivo: ' + e.message; }
  btn.disabled = false; btn.textContent = '↻ Actualizar';
}
document.getElementById('refresh').onclick = refresh;

function setOrigin(o, fit) {
  origin = o;
  document.getElementById('origen').innerHTML = `<b>${o.name}</b>`;
  render(); refresh();
  if (fit) map.setView([o.lat, o.lon], 16);
}
document.getElementById('reset').onclick = () => setOrigin({ ...DEFAULT }, true);
document.getElementById('gps').onclick = () => navigator.geolocation.getCurrentPosition(
  p => setOrigin({ lat: p.coords.latitude, lon: p.coords.longitude, name: 'Mi ubicación' }, true),
  () => alert('No se pudo obtener la ubicación'));
map.on('click', e => setOrigin({ lat: e.latlng.lat, lon: e.latlng.lng, name: 'Punto elegido en el mapa' }, false));

(async () => {
  data = await (await fetch('/api/lineas')).json();
  await refresh();
  map.setView([origin.lat, origin.lon], 16);
  setInterval(refresh, 15000);
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
